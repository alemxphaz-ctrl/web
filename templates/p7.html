{% extends "base.html" %}
{% block content %}
{% if video %}
<div class="text-center mb-4"><h1 class="h3 mb-1">Incrustación de un video</h1><p class="text-muted small mb-0">Práctica 7 · Video con HTML5</p></div>
<div class="row justify-content-center"><div class="col-12 col-lg-9"><div class="card shadow-sm"><div class="card-body p-3 p-md-4">
    <div class="video-marco"><video class="video-practica" controls preload="metadata" poster="{{ url_for('static', filename='pimpz.jpeg') }}"><source src="{{ url_for('static', filename='p9/video-pimpz.mp4') }}" type="video/mp4">Tu navegador no soporta la reproducción de video en HTML5.</video></div>
    <p class="text-muted small text-center mt-3 mb-0">Video de Pimpz</p>
</div></div><div class="text-center mt-4"><a href="{{ url_for('dispatch', path='p7') }}" class="btn btn-outline-secondary">Volver</a></div></div></div>
{% else %}
<div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="card shadow-sm"><div class="card-body text-center p-4">
    <h1 class="card-title h3">Incrustación de un video</h1>
    <p class="card-text text-muted">Práctica 7 · Reproduce el video de Pimpz directamente en la página.</p>
    <a href="{{ url_for('dispatch', path='p7/video') }}" class="btn btn-primary btn-lg mt-2">Ver video</a>
</div></div></div></div>
{% endif %}
{% endblock %}
